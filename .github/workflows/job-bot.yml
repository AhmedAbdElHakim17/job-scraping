name: Job Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_KEYWORDS: ${{ secrets.LINKEDIN_KEYWORDS }}
          LINKEDIN_LOCATIONS: ${{ secrets.LINKEDIN_LOCATIONS }}
          LINKEDIN_KEYWORDS_PER_CYCLE: ${{ secrets.LINKEDIN_KEYWORDS_PER_CYCLE }}
          SCRAPE_INTERVAL_MINUTES: ${{ secrets.SCRAPE_INTERVAL_MINUTES }}
        run: python main.py
